name: Deploy isolated v0.44.0 preview

on:
  push:
    branches: [preview-v0-44-0-heavy-boss]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: preview-v0-44-0-heavy-boss
          path: candidate
      - name: Validate candidate files
        run: |
          test -f candidate/index.html
          test -f candidate/style.css
          test -f candidate/main.js
          test -f candidate/src/core/game.js
      - name: Assemble preview without replacing the official root
        run: |
          mkdir -p site/previews/v0.44.0
          cp -a candidate/index.html candidate/style.css candidate/main.js candidate/src site/previews/v0.44.0/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload official site plus isolated preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}previews/v0.44.0/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
