name: Validate project

on:
  pull_request:
    branches: [main, feature/v0.43.0-enemy-ai-evolution]
  push:
    branches: [main, feature/v0.44.0-boss-evolution]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find . -path './.git' -prune -o -name '*.js' -type f -print0)
      - name: Check relative module imports
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          pattern = re.compile(r'(?:from\s*|import\s*)[\'"]([^\'"]+)[\'"]')
          missing = []

          for source in root.rglob('*.js'):
              if '.git' in source.parts:
                  continue
              text = source.read_text(encoding='utf-8')
              for specifier in pattern.findall(text):
                  if not specifier.startswith('.'):
                      continue
                  target = (source.parent / specifier.split('?', 1)[0]).resolve()
                  if not target.is_file():
                      missing.append(f'{source}: {specifier} -> {target}')

          if missing:
              print('Missing relative module imports:')
              print('\n'.join(missing))
              sys.exit(1)
          print('All relative JavaScript module imports resolve.')
          PY
      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            git diff --check "$PR_BASE_SHA"...HEAD
          else
            git show --check --oneline HEAD
          fi
